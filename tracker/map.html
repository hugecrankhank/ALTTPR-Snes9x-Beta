<!DOCTYPE html>
<html lang="en">
<head>
<script src="../bridge/sni-shim.js"></script> <!-- unified-app: routes SNI WebSocket to built-in emulator -->
<meta charset="UTF-8">
<title>ALTTP Map</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src * ws://*:*; img-src 'self' data:; style-src 'self' 'unsafe-inline';">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #000;
  font-family: Arial, sans-serif;
  color: #ccc;
  user-select: none;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── Topbar ── */
#topbar {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  padding: 4px 10px; background: #111; border-bottom: 1px solid #222;
  font-size: 11px;
}
.tb-label { color: #888; }
.tb-select {
  background: #1a1a1a; color: #ccc; border: 1px solid #333;
  border-radius: 3px; padding: 2px 5px; font-size: 11px; cursor: pointer;
}
.tb-sep { color: #333; margin: 0 2px; }
/* A narrow window (stacked layout, entrance shuffle's extra buttons) wraps the
   bar onto a second row instead of squashing labels and pushing Settings off
   the edge. The window re-fits to the taller bar (Chris, Sep 2026). */
#topbar { flex-wrap: wrap; row-gap: 4px; }
#topbar > * { white-space: nowrap; }
.tb-sep.row-edge { visibility: hidden; }
/* Entrance shuffle: two fixed rows — layout, zoom and Settings (top right) on
   the first; Connectors, Notes & Connectors and Checks on the second (Chris,
   Sep 2026). Flex order moves them; .tb-break forces the line. */
#topbar .tb-break { display: none; }
/* center: only the second row has free space — Settings' auto margin takes the first row's. */
#topbar.ent-rows { row-gap: 2px; justify-content: center; }
#topbar.ent-rows #settings-wrap { order: 1; }
#topbar.ent-rows .tb-break { display: block; order: 2; flex-basis: 100%; height: 0; }
#topbar.ent-rows #ent-sep-1 { display: none !important; }
#topbar.ent-rows #ent-conn-toggle-wrap, #topbar.ent-rows #ent-sep-2,
#topbar.ent-rows #ent-info-btn, #topbar.ent-rows #ent-sep-3,
#topbar.ent-rows #checklist-btn { order: 3; }
.zoom-btn {
  background: #1a1a1a; color: #ccc; border: 1px solid #333;
  border-radius: 3px; padding: 0 7px; font-size: 15px; line-height: 1.6;
  cursor: pointer; font-weight: bold;
}
.zoom-btn:hover { background: #333; color: #fff; }
#zoom-label { color: #fff; min-width: 40px; text-align: center; font-size: 11px; font-weight: bold; }

/* ── Settings menu (gear → dropdown panel) ── */
#settings-wrap { position: relative; margin-left: auto; }
#settings-btn {
  background: #1a1a1a; color: #ccc; border: 1px solid #333;
  border-radius: 3px; padding: 0 8px; font-size: 11px; line-height: 1.7;
  cursor: pointer;
}
#settings-btn:hover { background: #333; color: #fff; }
#settings-btn.open { background: #333; color: #fff; border-color: #555; }
#settings-panel {
  display: none;
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 60;
  min-width: 226px;
  background: #141414; border: 1px solid #333; border-radius: 5px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.75);
  padding: 8px 10px 10px;
  font-size: 11px;
}
#settings-panel.open { display: block; }
.set-group { margin-top: 9px; }
.set-group:first-child { margin-top: 0; }
.set-group-title {
  color: #6f6f6f; font-size: 9.5px; font-weight: bold;
  letter-spacing: 0.6px; text-transform: uppercase;
  padding-bottom: 4px; margin-bottom: 6px; border-bottom: 1px solid #262626;
}
.set-row {
  display: flex; align-items: center; gap: 6px;
  padding: 3px 0; color: #bbb;
}
.set-row label { cursor: pointer; display: flex; align-items: center; gap: 6px; flex: 1; }
/* A half indented under its master — same grouping cue as the launcher's menu. */
.set-row.sub { padding-left: 18px; }
/* 'Other' is a display mode rather than a shuffled item, so it sits apart. */
.set-row.sub-sep { border-top: 1px solid #2a2a2a; margin-top: 4px; padding-top: 5px; }
.set-row input[type="checkbox"] { cursor: pointer; margin: 0; }
.set-row select { flex: 1; }

/* ── Scroll area ── */
#maps-outer {
  flex: 1;
  overflow-x: hidden;
  overflow-y: auto;
  background: #000;
  min-height: 0;
  /* One number on all four sides: the window is sized to the maps plus exactly
     this much, so the border reads even (Chris, Sep 2026). Change it here and
     MAP_PAD below follows. */
  padding: 10px;
}
/* vertical-align: top — as an inline box #maps sat on the text baseline, and
   the 4px descender gap below it overflowed #maps-outer into a scrollbar. */
#maps { display: inline-flex; flex-direction: row; gap: 12px; position: relative; vertical-align: top; }
#maps.vertical { flex-direction: column; }

.map-wrap {
  position: relative;
  width: 512px; height: 512px;
  background-size: 100% 100%;
  background-repeat: no-repeat;
  flex-shrink: 0;
}
#lw { background-image: url('map/map_lw.png'); }
#dw { background-image: url('map/map_dw.png'); }

/* ── Check dots ── */
/* Below 75% map zoom the markers shrink with the map (--mk, set by applyZoom;
   Chris, Oct 2026). CSS zoom rather than width/height: one rule covers every
   marker type and everything drawn inside them, and they stay centred on
   their spot. */
.dot, .dng, .shop-marker, .bonk-dot, .ent-marker, .ent-label { zoom: var(--mk, 1); }
.dot {
  position: absolute;
  width: 18px; height: 18px;
  border-radius: 2px;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 2;
  transition: transform 0.08s;
}
.dot:hover { transform: translate(-50%,-50%) scale(1.5); z-index: 20; }
.dot.available { background: #4dff88; border: 2px solid #000; }
.dot.possible  { background: #ffd700; border: 2px solid #000; }
.dot.visible   { background: #ff8c00; border: 2px solid #000; }
.dot.ool       { background: #9333ea; border: 2px solid #000; }
.dot.unavail   { background: #ff4444; border: 2px solid #000; }
.dot.cleared   { background: rgba(40,40,40,0.85); border: 1.5px solid #555; z-index: 0; }
.dot.hidden    { display: none; pointer-events: none; }
/* Pottery shuffle: rooms that hold pots but were never a check get their own
   marker, placed on the entrance that leads there. Round, and a size down, so
   they don't read as checks. */
.dot.pot-dot   { width: 14px; height: 14px; border-radius: 50%; z-index: 3; }
.dot.pot-dot::after {
  content: ''; position: absolute; inset: 3px;
  border: 1px solid rgba(0,0,0,0.55); border-radius: 50%;
}

/* ── Shopsanity markers ─────────────────────────────────────────────────
   Small square with a $ inside, sized between the check dots (18px) and the
   entrance markers (13px). Fill is green/red straight from the shop's
   reachability logic; clicking dims it like a cleared check dot. */
.shop-marker {
  position: absolute;
  width: 15px; height: 15px;
  border: 1.5px solid #000;
  border-radius: 2px;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 6;
  background: #888;
  display: flex; align-items: center; justify-content: center;
  font: bold 11px/1 "Segoe UI", Arial, sans-serif;
  color: #000;
  transition: transform 0.08s;
}
.shop-marker:hover { transform: translate(-50%,-50%) scale(1.6); z-index: 21; }
/* Same five states as the check dots, so a shop that mirrors a check reads
   identically to it — including purple for out-of-logic. */
.shop-marker.available { background: #4dff88; }
.shop-marker.possible  { background: #ffd700; }
.shop-marker.visible   { background: #ff8c00; }
.shop-marker.ool       { background: #9333ea; }
.shop-marker.unavail   { background: #ff4444; }
.shop-marker.cleared   { background: rgba(40,40,40,0.85); border-color: #555; color: #777; z-index: 0; }
#maps.shops-hidden .shop-marker { display: none; pointer-events: none; }

/* ── Bonk shuffle markers ────────────────────────────────────────────────
   Bonk drops are dense (41 of them), so these are deliberately smaller than
   the 18px check dots — same idea as the reference tracker's .bonkloc. */
.bonk-dot {
  position: absolute;
  width: 11px; height: 11px;
  border: 1px solid #000;
  border-radius: 2px;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 3;
  transition: transform 0.08s;
}
.bonk-dot:hover { transform: translate(-50%,-50%) scale(1.8); z-index: 22; }
.bonk-dot.available { background: #4dff88; }
.bonk-dot.possible  { background: #ffd700; }
.bonk-dot.visible   { background: #ff8c00; }
.bonk-dot.ool       { background: #9333ea; }
.bonk-dot.unavail   { background: #ff4444; }
.bonk-dot.cleared   { background: rgba(40,40,40,0.85); border-color: #555; z-index: 0; }
#maps.bonk-hidden .bonk-dot { display: none; pointer-events: none; }
/* Cold Fairy Statue is inside Ice Palace — the reference drops it in
   entrance shuffle, where its overworld position is meaningless. */
#maps:not(.entrances-hidden) .bonk-dot[data-bonk-indoor="1"] { display: none; pointer-events: none; }

/* ── Entrance markers (entrance shuffle overlay) ───────────────────────── */
.ent-marker {
  position: absolute;
  width: 13px; height: 13px;
  border: 1.5px solid #000;
  transform: translate(-50%, -50%) rotate(45deg);
  cursor: pointer;
  z-index: 5;
  background: #888;
  transition: transform 0.08s;
}
.ent-marker:hover { transform: translate(-50%,-50%) rotate(45deg) scale(1.6); z-index: 21; }
.ent-marker.unconnected { background: #4dff88; }
.ent-marker.connector   { background: #ED18E2; }
.ent-marker.dungeon     { background: #c77dff; }
.ent-marker.location    { background: #ffd700; }
.ent-marker.connect-pending { box-shadow: 0 0 0 3px #fff; }
.ent-marker.cleared { background: rgba(70,70,70,0.85); border-color: #666; opacity: 0.75; z-index: 0; }
.ent-marker.ent-unavailable:not(.cleared) { background: #d32f2f !important; border-color: #7a0000; }
.ent-marker.ent-ool:not(.cleared) { background: #9333ea !important; border-color: #4c1d95; }
.ent-marker.ent-dungeon-cleared:not(.cleared) { background: rgba(70,70,70,0.85); border-color: #666; opacity: 0.75; z-index: 0; }
.ent-marker.ent-boss-cleared:not(.cleared):not(.ent-dungeon-cleared) { background: #9bd0f5; border-color: #4a90c4; opacity: 0.85; }

/* Boss status diagonal stripe overlay for dungeon-marked entrance markers
   (mirrors .dng.boss-stripe-red/yellow, rotated to match the box shape). */
.ent-marker.boss-stripe-red::after,
.ent-marker.boss-stripe-yellow::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
}
.ent-marker.boss-stripe-red::after {
  background: linear-gradient(45deg,
    transparent calc(50% - 2px),
    #e74c3c   calc(50% - 2px),
    #e74c3c   calc(50% + 2px),
    transparent calc(50% + 2px));
}
.ent-marker.boss-stripe-yellow::after {
  background: linear-gradient(45deg,
    transparent calc(50% - 2px),
    #ffd54a   calc(50% - 2px),
    #ffd54a   calc(50% + 2px),
    transparent calc(50% + 2px));
}

/* Shape overrides: diamond = unchecked/unmarked (default).
   Box = marked with a key location code. Circle = connector. */
.ent-marker.ent-marked {
  border-radius: 2px;
  transform: translate(-50%, -50%) rotate(0deg);
}
.ent-marker.ent-marked:hover { transform: translate(-50%,-50%) rotate(0deg) scale(1.6); }
.ent-marker.ent-has-prize {
  width: 20px; height: 20px;
}
/* Entrance shuffle: a dungeon-marked entrance gets the same quarter fill the
   dungeon squares use — green quadrants for the share of what's left inside
   that can actually be got. */
.ent-marker.q1::before, .ent-marker.q2::before, .ent-marker.q3::before {
  content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background-image: linear-gradient(#4dff88, #4dff88);
  background-repeat: no-repeat;
  background-size: 50% 50%;
}
.ent-marker.q1::before { background-position: 0 0; }
.ent-marker.q2::before { background-position: 0 0, 100% 0;
  background-image: linear-gradient(#4dff88,#4dff88), linear-gradient(#4dff88,#4dff88); }
.ent-marker.q3::before { background-position: 0 0, 100% 0, 100% 100%;
  background-image: linear-gradient(#4dff88,#4dff88), linear-gradient(#4dff88,#4dff88),
                    linear-gradient(#4dff88,#4dff88); }
.ent-marker.connector {
  border-radius: 50%;
  transform: translate(-50%, -50%) rotate(0deg);
}
.ent-marker.connector:hover { transform: translate(-50%,-50%) rotate(0deg) scale(1.6); }
.ent-marker-prize {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 16px; height: 16px;
  object-fit: contain;
  pointer-events: none;
}
/* A Retro door that mirrors a check (DOOR_CHECK) carries that check's colour,
   so the diamond needs the check dot's yellow/orange/purple as well as the
   green and red the entrance overlay already has. Same hex values as .dot. */
.ent-marker.retro-possible:not(.cleared) { background: #ffd700; }
.ent-marker.retro-visible:not(.cleared)  { background: #ff8c00; }
.ent-marker.retro-ool:not(.cleared)      { background: #9333ea; }

/* The entrance overlay hides its markers whenever entrance shuffle is off.
   Retro doors borrow .ent-marker for the diamond but are NOT part of that
   overlay — they show precisely when it is hidden — so they opt out here and
   manage their own display in refreshRetroDoors(). */
#maps.entrances-hidden .ent-marker:not(.retro-door) { display: none; pointer-events: none; }
#maps:not(.entrances-hidden) .dot[data-ent-hidden="1"] { display: none; pointer-events: none; }
#maps:not(.entrances-hidden) .dng[data-ent-hidden="1"] { display: none; pointer-events: none; }

.ent-line {
  position: absolute;
  height: 2px;
  background: #ED18E2;
  transform-origin: 0 0;
  z-index: 4;
  pointer-events: none;
}
/* One-way connector: arrowhead at the destination end of the line, pulled
   back slightly so it points at (rather than sits under) the marker. */
.ent-line-oneway::after {
  content: '';
  position: absolute;
  right: 10px;
  top: 50%;
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 5px 0 5px 8px;
  border-color: transparent transparent transparent #ED18E2;
  transform: translateY(-50%);
}
/* One-way connector: small dot marking the source end of the line. */
.ent-line-oneway::before {
  content: '';
  position: absolute;
  left: -3px;
  top: 50%;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ED18E2;
  transform: translateY(-50%);
}
#maps.entrances-hidden .ent-line { display: none; }

/* ── Entrance label (right-click → tag with key location code) ── */
.ent-label {
  position: absolute;
  transform: translate(-50%, -50%);
  margin-top: -16px; /* sit above the diamond marker */
  background: #000;
  color: #fff;
  border: 1px solid #555;
  border-radius: 3px;
  padding: 1px 4px;
  font-size: 10px;
  font-weight: normal;
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  letter-spacing: 0.3px;
  white-space: nowrap;
  pointer-events: none;
  z-index: 1;
}
#maps.entrances-hidden .ent-label { display: none; }
.ent-label.ent-label-below { margin-top: 16px; /* sit below the diamond marker instead */ }
.ent-label.ent-label-emoji {
  font-size: 11px;
  padding: 1px 3px;
  line-height: 1.2;
}
.ent-label.ent-label-emoji.ent-label-fairy {
  font-size: 8px;
  padding: 0 2px;
}
.ent-label-gold { color: #ffd700; }

/* ── Entrance right-click menu ── */
#ent-popup {
  position: fixed;
  background: rgba(20, 20, 20, 0.97);
  border: 1px solid #555;
  border-radius: 6px;
  padding: 10px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
  z-index: 10001;
  display: none;
  font-size: 11px;
  width: 620px;
  max-width: calc(100vw - 16px);
  max-height: calc(100vh - 16px);
  overflow-y: auto;
}
#ent-popup.open { display: block; }
.ent-popup-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2px 6px;
  border-bottom: 1px solid #333;
  margin-bottom: 6px;
  gap: 8px;
}
.ent-popup-title { font-size: 12px; color: #fff; font-weight: bold; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ent-popup-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.ent-popup-row label { color: #aaa; }
.ent-popup-row input[type="text"] {
  flex: 1; background: #1a1a1a; color: #ccc; border: 1px solid #333;
  border-radius: 3px; padding: 2px 5px; font-size: 11px;
}
.ent-popup-btn {
  background: #1a1a1a; color: #ccc; border: 1px solid #333;
  border-radius: 3px; padding: 3px 8px; font-size: 11px; cursor: pointer;
}
.ent-popup-btn:hover { background: #333; color: #fff; }
.ent-popup-btn.active { background: #ED18E2; color: #fff; border-color: #ED18E2; }
#ent-popup-connect { background: #ED18E2; color: #fff; border-color: #ED18E2; }
#ent-popup-connect:hover { background: #ff4df3; border-color: #ff4df3; }
.ent-popup-btn.marked { color: #fff; border: 1px solid #fff; font-weight: bold; box-shadow: 0 0 4px rgba(255,255,255,0.6); }
.ent-popup-btn.danger { color: #ff8c8c; border-color: #5a2a2a; }
.ent-popup-btn.danger:hover { background: #3a1414; color: #fff; }
.ent-popup-section-label { color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin: 8px 0 4px; }
.ent-popup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 4px; }
.ent-popup-grid .ent-popup-btn { padding: 5px 4px; text-align: center; font-size: 11px; white-space: nowrap; position: relative; }
.ent-popup-prize { position: absolute; bottom: 1px; right: 1px; width: 14px; height: 14px; object-fit: contain; cursor: pointer; pointer-events: auto; }
.ent-popup-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; }
.ent-popup-conn-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.ent-popup-conn-row .swatch { width: 10px; height: 10px; border: 1px solid #000; transform: rotate(45deg); flex-shrink: 0; }

/* ── Notes & Connectors summary popup ── */
#ent-info-popup {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(20, 20, 20, 0.97);
  border: 1px solid #555;
  border-radius: 6px;
  padding: 10px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
  z-index: 10001;
  display: none;
  font-size: 11px;
  width: 980px;
  max-width: calc(100vw - 16px);
  max-height: calc(100vh - 16px);
  overflow-y: auto;
}
#ent-info-popup.open { display: block; }
.ent-info-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.ent-info-col { min-width: 0; }
.ent-info-list { color: #ccc; line-height: 1.6; }
.ent-info-list .ent-info-empty { color: #666; font-style: italic; }
.ent-info-list .ent-info-cleared { color: #777; text-decoration: line-through; }

/* ── Connector visibility toggle (independent of overlay toggle) ── */
#maps.ent-conn-hidden .ent-line { display: none; }

/* ── Check annotations (right-click → tag with item) ── */
.dot-annotation {
  position: absolute;
  top: -11px; right: -11.5px;   /* up and out, so the dot's colour shows */
  width: 22px; height: 22px;
  pointer-events: none;
  z-index: 3;
  filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000);
  image-rendering: pixelated;
}
.dot-annotation.text {
  display: flex; align-items: center; justify-content: center;
  background: #000; color: #fff;
  border-radius: 50%;
  font-size: 14px; font-weight: bold;
  font-family: Arial, sans-serif;
}

#annotation-popup {
  position: fixed;
  background: rgba(20, 20, 20, 0.97);
  border: 1px solid #555;
  border-radius: 6px;
  padding: 6px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
  z-index: 10000;
  display: none;
}
#annotation-popup.open { display: block; }
.popup-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 4px 6px;
  border-bottom: 1px solid #333;
  margin-bottom: 6px;
}
.popup-title { font-size: 11px; color: #ccc; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.popup-clear {
  font-size: 10px; color: #ff8c8c; background: transparent;
  border: 1px solid #5a2a2a; border-radius: 3px;
  padding: 1px 6px; cursor: pointer;
}
.popup-clear:hover { background: #3a1414; color: #fff; }
.popup-grid { display: grid; grid-template-columns: repeat(8, 28px); gap: 2px; }
.popup-item {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 3px; cursor: pointer;
  background: #1a1a1a; border: 1px solid transparent;
  transition: background 0.1s, border-color 0.1s;
}
.popup-item:hover { background: #2a3a4a; border-color: #5a8eff; }
.popup-item img { width: 22px; height: 22px; image-rendering: pixelated; }
.popup-item.text { font-size: 14px; font-weight: bold; color: #aaa; }

/* ── Dungeon markers ── */
.dng {
  position: absolute;
  width: 28px; height: 28px;
  border-radius: 3px;
  transform: translate(-50%, -50%);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 5;
  border: 2px solid #000;
  background: #ff4444;
  overflow: hidden;
  transition: transform 0.08s;
}
.dng:hover { transform: translate(-50%,-50%) scale(1.2); z-index: 25; }
.dng.available   { background: #4dff88; border-color: #000; }
.dng.boss-cleared { background: #b9bdc4; border-color: #000; opacity: 0.85; } /* boss beaten, items remain */
.dng.possible  { background: #ffd700; border-color: #000; }
.dng.visible   { background: #ff8c00; border-color: #000; }
.dng.ool       { background: #9333ea; border-color: #000; }
.dng.unavail   { background: #ff4444; border-color: #000; }
.dng.cleared   { background: rgba(70,70,70,0.85); border-color: #666; opacity: 0.75; }
/* Key Sanity / MCK: green quadrants show how much of what's LEFT in that dungeon
   is obtainable — one quadrant per quarter, clockwise from the top left. The
   rest of the square keeps the dungeon's own status colour. */
.dng.q1::before, .dng.q2::before, .dng.q3::before,
.dot.q1::before, .dot.q2::before, .dot.q3::before {
  content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background-image: linear-gradient(#4dff88, #4dff88);
  background-repeat: no-repeat;
  background-size: 50% 50%;
}
/* A cleared dot that still has pots/drops behind it: one quarter, green when
   any of them are gettable, red when none are. */
.dot.qr::before {
  content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background-image: linear-gradient(#ff4444, #ff4444);
  background-repeat: no-repeat; background-size: 50% 50%; background-position: 0 0;
}
.dng.q1::before, .dot.q1::before { background-position: 0 0; }
.dng.q2::before, .dot.q2::before { background-position: 0 0, 100% 0;
  background-image: linear-gradient(#4dff88,#4dff88), linear-gradient(#4dff88,#4dff88); }
.dng.q3::before, .dot.q3::before { background-position: 0 0, 100% 0, 100% 100%;
  background-image: linear-gradient(#4dff88,#4dff88), linear-gradient(#4dff88,#4dff88),
                    linear-gradient(#4dff88,#4dff88); }
.dng img       { width: 22px; height: 22px; object-fit: contain; image-rendering: pixelated; position: relative; z-index: 4; }
/* Ganon and the Key Sanity map hint fill the whole square, hiding the status
   colour and the quadrants under them — draw those two 10% smaller. */
.dng img[src$="boss10.png"], .dng img[src$="map1.png"] { width: 20px; height: 20px; }
.dng.no-prize  { font-size: 8px; font-weight: bold; color: #fff; }

/* ── Boss status diagonal stripe overlay ──
   Painted via ::after as a thin diagonal band across the dungeon marker.
   Red  = boss selected but item requirement not yet met, or boss unknown
          and the dungeon isn't currently reachable.
   Yellow = boss unknown and the dungeon is available/possible. */
.dng.boss-stripe-red::after,
.dng.boss-stripe-yellow::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
}
.dng.boss-stripe-red::after {
  background: linear-gradient(45deg,
    transparent calc(50% - 2.5px),
    #e74c3c   calc(50% - 2.5px),
    #e74c3c   calc(50% + 2.5px),
    transparent calc(50% + 2.5px));
}
.dng.boss-stripe-yellow::after {
  background: linear-gradient(45deg,
    transparent calc(50% - 2.5px),
    #ffd54a   calc(50% - 2.5px),
    #ffd54a   calc(50% + 2.5px),
    transparent calc(50% + 2.5px));
}

/* ── Bottom bar ── */
#bottombar {
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  padding: 3px 10px; background: #0a0a0a; border-top: 1px solid #1a1a1a;

#legend { display: flex; align-items: center; gap: 10px; }

<script>
// macOS: Ctrl+click is the right-click. Chromium sends it as a contextmenu
// AND an ordinary click, so every control with both a left- and right-click
// action did both — right-clicking a prize to mark it collected also cycled it
// one step on (crystal → red crystal, pendant → green pendant; Chris, Oct
// 2026). The contextmenu handler is the one that means it, so the click is
// swallowed before any element sees it.
window.addEventListener('click', function (e) {
  if (e.ctrlKey) { e.stopPropagation(); e.preventDefault(); }
}, true);
// ── Early settings init — must run before any logic scripts ──────────────────
(function() {
  var p = new URLSearchParams(window.location.search);
  window.trackerSettings = window.trackerSettings || {};
  window.trackerSettings.gamemode     = p.get('gamemode')     || localStorage.getItem('alttp-gamemode')      || 'standard';
  window.trackerSettings.dungeonItems = p.get('dungeonitems') || localStorage.getItem('alttp-dungeon-items') || 'standard';
  // The four shuffle flags (js/dngpanel.js reads these). '' means "nothing
  // shuffled", so only a missing value falls back to the mode's preset.
  window.trackerSettings.dungeonShuffle = (function () {
    var v = p.get('dungeonshuffle');
    if (v === null) { try { v = localStorage.getItem('alttp-dungeon-shuffle'); } catch (e) { v = null; } }
    return (v === null) ? undefined : v;
  })();
  window.trackerSettings.enemizer     = p.get('enemizer')     || localStorage.getItem('alttp-enemizer')      || 'yes';
  window.trackerSettings.swordless    = p.get('swordless')    || localStorage.getItem('alttp-swordless')     || 'no';
  window.trackerSettings.bossShuffle  = p.get('bossshuffle')  || localStorage.getItem('alttp-bossshuffle')   || 'yes';
  window.trackerSettings.gtCrystals   = parseInt(p.get('gtcrystals') || localStorage.getItem('alttp-gt-crystals') || '7');
  // Inverted 1.0 and 2.0 share the whole inverted layout; 2.0 differs only in a
  // handful of logic rules, which read trackerSettings.inverted2 (see
  // INVERTED-2-README.md). Everything else asks .inverted and gets both.
  window.trackerSettings.inverted     = /^inverted/.test(window.trackerSettings.gamemode);
  window.trackerSettings.inverted2    = window.trackerSettings.gamemode === 'inverted2';

  // ── The GT crystal requirement, resolved ──
  // 0 is a legal requirement (GT open from the start) and 0 is falsy, so the
  // old `settings.gtCrystals || 7` silently turned an open-GT seed back into a
  // 7-crystal one. Every comparison site goes through this instead.
  window.gtCrystalReq = function() {
    var v = parseInt(window.trackerSettings && window.trackerSettings.gtCrystals, 10);
    return (v >= 0 && v <= 7) ? v : 7;
  };

  window.trackerSettings.entranceShuffle = (p.get('entranceshuffle') || localStorage.getItem('alttp-entrance-shuffle') || 'yes') === 'yes';
  // Universal Keys — small keys bought from shops rather than found in dungeons.
  // Retro implies it, but a seed can use universal keys under any world state,
  // so it's a flag of its own rather than a read of gamemode.
  window.trackerSettings.universalKeys = p.get('universalkeys') || localStorage.getItem('alttp-universal-keys') || 'no';
  // Key Drop Shuffle — pot keys and enemy drops become shuffled locations.
  // Independent of every other flag; it raises each dungeon's key count.
  // "Key Drop" is the combined mode — pot keys AND enemy drops.
  window.trackerSettings.pottery = p.get('pottery') || localStorage.getItem('alttp-pottery') || 'none';
  window.trackerSettings.keyDropAll = p.get('keydropall') || localStorage.getItem('alttp-keydrop-all') || 'no';
  window.trackerSettings.keyDrop = p.get('keydrop') || localStorage.getItem('alttp-keydrop') || 'no';
  // Enemy Key Drop — the same idea for enemy-dropped keys. Independent flag.
  window.trackerSettings.enemyKeyDrop = p.get('enemykeydrop') || localStorage.getItem('alttp-enemy-keydrop') || 'no';

  // ── Map style ──
  // Single source of truth for which marker set the map draws. 'standard' shows
  // the normal check dots; 'entrance' shows the entrance-shuffle overlay.
  // trackerSettings.entranceShuffle stays as the boolean every logic branch
  // already reads — mapStyle is the forward-looking name the settings menu uses,
  // so new styles can be added without another boolean per style.
  window.trackerSettings.mapStyle = window.trackerSettings.entranceShuffle ? 'entrance' : 'standard';

  // ── v1.1.17 seed flags ──
  // Menu + flag only for now: nothing on the map keys off these yet. They are
  // parsed and persisted here so the shop/bonk check locations can be added
  // later without touching the settings plumbing again.
  // **Strings, not booleans.** These three are declared `yesNo: true` in the
  // settings menu's OPTIONS, which means the menu reads and writes them as the
  // literal 'yes'/'no' — exactly like universalKeys and the key-drop trio just
  // above. Resolving them to a boolean here left every checkbox unticked and
  // the launcher's settings looking like they never arrived. Same trap the
  // OPTIONS comment warns about; it caught me anyway.
  window.trackerSettings.potDrops   = p.get('potdrops')   || localStorage.getItem('alttp-pot-drops')   || 'no';
  window.trackerSettings.enemyDrops = p.get('enemydrops') || localStorage.getItem('alttp-enemy-drops') || 'no';
  window.trackerSettings.potsBones  = p.get('potsbones')  || localStorage.getItem('alttp-pots-bones')  || 'no';
  window.trackerSettings.shopsanity  = (p.get('shopsanity')  || localStorage.getItem('alttp-shopsanity')   || 'no') === 'yes';
  window.trackerSettings.bonkShuffle = (p.get('bonkshuffle') || localStorage.getItem('alttp-bonk-shuffle') || 'no') === 'yes';
  window.trackerSettings.randomPrize = (localStorage.getItem('alttp-random-prize') || 'no');
})();
</script>

  if (!data || !data.length) return false;

  // compare, and swap the one ent_logic.js reads.
  window.logic_entrances_noglitches = window.logic_entrances;
  if (set) window.logic_entrances = set;
})();

// Prize image arrays for cycling (when prize>=0)
// Standard mode: 0=crystal, 1=redcrystal, 2=pendant, 3=greenpendant
// Key Sanity:    0=unknown, 1=crystal, 2=redcrystal, 3=pendant, 4=greenpendant
// One prize cycle for every dungeon-item mode. There used to be a separate
// four-entry standard cycle without "?", which meant two things: "?" couldn't
// be selected in Standard (some seeds put dungeon prizes in the overworld),
// and prizeIndexByName('unknown') fell through to 0 = crystal, so an unknown
// prize broadcast by the item tracker silently drew as a crystal.
var PRIZE_CYCLE = [
  { name:'unknown',      img:'items/unknown1.png',      imgCleared:'items/unknown0.png'      },
  { name:'crystal',      img:'items/crystal1.png',      imgCleared:'items/crystal0.png'      },
  { name:'redcrystal',   img:'items/redcrystal1.png',   imgCleared:'items/redcrystal0.png'   },
  { name:'pendant',      img:'items/pendant1.png',      imgCleared:'items/pendant0.png'      },
  { name:'greenpendant', img:'items/greenpendant1.png', imgCleared:'items/greenpendant0.png' },
];

// Helper: find prize index by name in current cycle
function prizeIndexByName(name) {
  for (var i = 0; i < PRIZE_CYCLE.length; i++) {
    if (PRIZE_CYCLE[i].name === name) return i;
  }
  return 0; // default to first entry
}
// Starting prize for every dungeon. Mirrors defaultPrizeIndex() in
// js/items.js, so the map and the item tracker agree on what a fresh board
// looks like: crystals under Standard dungeon item shuffle, ? under every
// shuffled setting. Nothing is read from storage — the item tracker's own
// setting is session-only, and any prize the player actually changes reaches
// the map through the broadcast snapshot anyway.
window.defaultPrizeIndex = function() {
  var mode = 'standard';
  try {
    if (localStorage.getItem('alttp-random-prize') === 'yes') return 0;  // prizes can be anywhere
    mode = (window.trackerSettings && window.trackerSettings.dungeonItems)
        || localStorage.getItem('alttp-dungeon-items') || 'standard';
  } catch(e) {}
  return (mode === 'standard') ? 1 : 0;   // 0 = unknown, 1 = crystal in PRIZE_CYCLE
};

(function() {
  // Initialise mapObtained on all dungeons
  Object.keys(DUNGEONS).forEach(function(key) { DUNGEONS[key].mapObtained = false; DUNGEONS[key].otherCleared = false; });
  // The DUNGEONS literals all carry prize:0, which meant crystal under the old
  // four-entry standard cycle but means unknown now — so set it explicitly
  // rather than relying on the literal.
  var idx = window.defaultPrizeIndex();
  Object.keys(DUNGEONS).forEach(function(key) {
    var def = DUNGEONS[key];
    if (def.prize === -2) return; // CT and GT have fixed prizes
    def.prize      = idx;
    def.img        = PRIZE_CYCLE[idx].img;
    def.imgCleared = PRIZE_CYCLE[idx].imgCleared;
  });
})();

// Always start fresh — checks are cleared on each page load (new game).

// The one exception is a state file being restored. _applyEntState reloads the
// page to apply cleanly, and this wipe used to run afterwards and throw the
// file's checks away — the save format carries them, so a run saved mid-session
// came back with every check un-ticked. It hands them over in a one-shot key
// instead, which the wipe above doesn't touch.
var checkState = {};
try { localStorage.removeItem('alttp-checks'); } catch(e) {}

  var _restoreChecks = localStorage.getItem('alttp-checks-restore');
  if (_restoreChecks) {
    localStorage.removeItem('alttp-checks-restore');
    var _rc = JSON.parse(_restoreChecks);
    if (_rc && typeof _rc === 'object') checkState = _rc;
    localStorage.setItem('alttp-checks', JSON.stringify(checkState));

} catch(e) {}
function saveCheckState() { try { localStorage.setItem('alttp-checks', JSON.stringify(checkState)); } catch(e) {} }

var _resettingGame = false;
function resetChecks() {
  if (_resettingGame) return;
  _resettingGame = true;
  // Broadcast to item tracker
  try { if (window._bc) window._bc.postMessage({ type: 'newgame' }); } catch(e) {}
  setTimeout(function() { _resettingGame = false; }, 2000);
  checkState = {};
  saveCheckState();
  // Clear per-location dungeon cleared marks (js/dngpanel.js owns the store)
  try { if (window.dngLocClearedReset) window.dngLocClearedReset(); } catch(e) {}
  try { checkSubCleared = {}; saveCheckSubCleared(); } catch(e) {}
  // Clear right-click annotations and refresh any dots already on the map
  checkAnnotations = {};
  saveAnnotations();
  Object.keys(dotById).forEach(function(id) { renderAnnotation(dotById[id], parseInt(id)); });
  // Reset prize-derived item counts
  window.trackerItems.crystals     = 0;
  window.trackerItems.pendants     = 0;
  window.trackerItems.greenPendant = 0;
  window.trackerItems.redCrystal   = 0;
  window.trackerItems.ctSmallKeys  = 0;
  // Redraw all dots
  Object.keys(dotById).forEach(function(id) {
    dotById[id].className = dotClass(parseInt(id));
  });
  if (typeof refreshPotDots === 'function') refreshPotDots();
  // Reset dungeon cleared/obtained state
  Object.keys(DUNGEONS).forEach(function(key) {
    DUNGEONS[key].cleared       = false;
    DUNGEONS[key].prizeObtained = false;
    DUNGEONS[key].fullyCleared  = false;
    refreshDungeonImg(key);
  });
  window.refreshMapLogic();
  // Reset entrance overlay state (labels, notes, connectors, cleared markers)
  if (typeof window._entResetAll === 'function') window._entResetAll();
  // Reset shopsanity marker and bonk check state
  if (typeof window._shopResetAll === 'function') window._shopResetAll();
  if (typeof window._bonkResetAll === 'function') window._bonkResetAll();
  if (typeof window._retroDoorsResetAll === 'function') window._retroDoorsResetAll();
  // OnlyADKD's entrance map is part of the mode, not something the player
  // built — a new game should come back with it already in place. Everything

  if (onlyAdkd() && typeof window._onlyAdkdLoadMap === 'function') {
    window._onlyAdkdLoadMap();

}

var ONLYADKD_CHECK = 65;   // Bottle Merchant

function onlyAdkd() {
  try {
    return (new URLSearchParams(location.search).get('preset') ||
            localStorage.getItem('alttp-preset') || '') === 'onlyadkd';
  } catch (e) { return false; }

// OnlyADKD's map is fixed (onlyadkd.json), and six of its doors lead to an
// interior that still holds an item. Walking through one of those doors puts
// you inside a cave whose own front door is somewhere else entirely, so what
// matters is what it takes to reach THE DOOR — the interior's vanilla
// requirements never apply. Keyed by door name for the entrance hover, with the
// interior's check id so its chests and their cleared marks come along.
var ONLYADKD_ITEM_DOORS = {
  'Skull Woods Final Section':     { check: 15, dest: 'Blinds Hideout',
    need: function (it) { return !!(it.bomb && it.moonpearl && it.firerod && _adkdDarkWorldNW(it)); } },
  'Bat Cave Drop':                 { check: 14, dest: 'Kakariko Well',
    need: function (it) { return !!(it.hammer && it.bomb); } },
  'Mire Hint':                     { check: 1,  dest: 'Dam',
    need: function (it) { return !!it.moonpearl; } },
  'Desert Palace Entrance (West)': { check: 19, dest: 'Mini Moldorm Cave',
    need: function (it) { return !!it.mirror; } },
  'Mimic Cave':                    { check: 16, dest: 'Hype Cave',
    need: function (it) { return !!(it.mirror && it.somaria); } },
  // The barrier across the tower door: the cape walks through it, the master
  // sword cuts it.
  'Agahnims Tower':                { check: 17, dest: 'Paradox Cave',
    need: function (it) { return !!(it.cape || it.sword >= 2); } }
};
// The same six by check id, for the colour wrapper below.
var ONLYADKD_ITEM_CHECKS = {};
Object.keys(ONLYADKD_ITEM_DOORS).forEach(function (door) {
  var m = ONLYADKD_ITEM_DOORS[door];
  ONLYADKD_ITEM_CHECKS[m.check] = { ent: door, dest: m.dest, need: m.need };
});
// Reaching the north-west Dark World. Same formula the SW dungeon rule uses;
// it lives in an earlier script, so this is a copy rather than a shared call.
function _adkdDarkWorldNW(it) {
  return it.gloves >= 2 ||
         (it.hammer && it.gloves >= 1) ||
         (it.agahnim && it.hookshot && (it.hammer || it.gloves >= 1 || it.flippers));
}

// Those six answer to the door, not to their own vanilla logic, so the colour
// function is wrapped rather than every rule being special-cased. Their chests
// inherit it, which is what paints the rows on the entrance's card.
(function applyOnlyAdkdItemLogic() {
  if (!onlyAdkd()) return;
  var _checkColor = window.checkColor;
  window.checkColor = function (id) {
    var m = ONLYADKD_ITEM_CHECKS[id];
    if (!m) return _checkColor ? _checkColor(id) : 'green';
    return m.need(window.trackerItems || {}) ? 'green' : 'red';
  };
})();

function dotClass(id) {
  if (onlyAdkd() && id !== ONLYADKD_CHECK && !ONLYADKD_EXTRA_CHECKS[id]) return 'dot hidden';
  if (checkState[id] && !potsLeftFor(id).length) {
    var rcDone = rollupCounts(id);
    if (!rcDone) return 'dot cleared';
    // Chests done, pots/drops not: grey dot, one quarter — green if any of
    // what's left is gettable, red if none of it is.
    return 'dot cleared ' + (rcDone.obtainable ? 'q1' : 'qr');
  }
  var color = window.checkColor ? window.checkColor(id) : 'green';
  if (color === null) return 'dot hidden';
  var cls = { green:'available', yellow:'possible', orange:'visible', purple:'ool', red:'unavail' };
  var name = cls[color] || 'available';
  // A multi-chest check answers to its own chests: the dot takes the best of
  // them, plus the same quarter fill the dungeon squares use — one green
  // quadrant per quarter of what's left that can actually be got. That keeps
  // the dot and the hover card from ever disagreeing.
  var sum = checkSubSummary(id);
  if (sum) {
    name = sum.best || name;
    if (sum.fill > 0 && sum.fill < 1) {
      var q = Math.round(sum.fill * 4);
      // A partly-filled dot can't also read solid green.
      if (q >= 1 && q <= 3) return 'dot ' + (name === 'available' ? 'possible' : name) + ' q' + q;
    }
  }
  return 'dot ' + name;
}

function findAnnotationItem(key) {
  for (var i = 0; i < ANNOTATION_ITEMS.length;   i++) if (ANNOTATION_ITEMS[i].key   === key) return ANNOTATION_ITEMS[i];
  for (var j = 0; j < ANNOTATION_SPECIAL.length; j++) if (ANNOTATION_SPECIAL[j].key === key) return ANNOTATION_SPECIAL[j];

function renderAnnotation(dotEl, checkId) {
  var existing = dotEl.querySelector('.dot-annotation');
  if (existing) existing.remove();
  var key = checkAnnotations[checkId];
  if (!key) return;
  var meta = findAnnotationItem(key);
  if (!meta) return;
  if (meta.src) {
    var img = document.createElement('img');
    img.className = 'dot-annotation';
    img.src = meta.src; img.alt = meta.alt;
    dotEl.appendChild(img);
  } else if (meta.text) {
    var span = document.createElement('span');
    span.className = 'dot-annotation text';
    span.textContent = meta.text;
    dotEl.appendChild(span);
  }
}

// Popup state
var _annotationPopup, _annotationGrid, _annotationTitle, _annotationClear;
var _annotationActiveId = null, _annotationActiveDot = null;

function _buildAnnotationPopupGrid() {
  ANNOTATION_ITEMS.concat(ANNOTATION_SPECIAL).forEach(function(item) {
    var cell = document.createElement('div');
    cell.className = 'popup-item' + (item.text ? ' text' : '');
    cell.title = item.alt;
    if (item.src) {
      var img = document.createElement('img');
      img.src = item.src; img.alt = item.alt;
      cell.appendChild(img);
    } else {
      cell.textContent = item.text;
    }
    cell.addEventListener('click', function() {
      if (_annotationActiveId == null) return;
      checkAnnotations[_annotationActiveId] = item.key;
      saveAnnotations();
      renderAnnotation(_annotationActiveDot, _annotationActiveId);
      closeAnnotationPopup();
    });
    _annotationGrid.appendChild(cell);
  });
}

function openAnnotationPopup(dotEl, checkId, x, y) {
  if (!_annotationPopup) return;
  _annotationActiveId  = checkId;
  _annotationActiveDot = dotEl;
  _annotationTitle.textContent = dotEl.dataset.checkName || dotEl.title || ('Check ' + checkId);
  _annotationPopup.classList.add('open');
  var pw = _annotationPopup.offsetWidth, ph = _annotationPopup.offsetHeight;
  var px = Math.min(x, window.innerWidth  - pw - 8);
  var py = Math.min(y, window.innerHeight - ph - 8);
  _annotationPopup.style.left = Math.max(8, px) + 'px';
  _annotationPopup.style.top  = Math.max(8, py) + 'px';
}
function closeAnnotationPopup() {
  if (!_annotationPopup) return;
  _annotationPopup.classList.remove('open');
  _annotationActiveId  = null;
  _annotationActiveDot = null;
}

(function initAnnotationPopup() {
  _annotationPopup = document.getElementById('annotation-popup');
  _annotationGrid  = document.getElementById('annotation-grid');
  _annotationTitle = document.getElementById('annotation-title');
  _annotationClear = document.getElementById('annotation-clear');
  if (!_annotationPopup) return;
  _buildAnnotationPopupGrid();
  _annotationClear.addEventListener('click', function() {
    if (_annotationActiveId == null) return;
    delete checkAnnotations[_annotationActiveId];
    saveAnnotations();
    renderAnnotation(_annotationActiveDot, _annotationActiveId);
    closeAnnotationPopup();

  document.addEventListener('mousedown', function(e) {
    if (!_annotationPopup.classList.contains('open')) return;

        var m = entMarkers[ename];
        if (m) {
          m.classList.add('cleared');
          applyMarkerColor(ename);
          renderLabel(ename);
        }
      }
    }
    localStorage.setItem('ent-cleared', JSON.stringify(clearedState));
  };

  // Cycle a connection's direction: two-way -> one-way (from -> to) ->
  // two-way. The 3rd array element stores the "from" entrance name when
  // one-way, or is absent/falsy for a normal two-way connector.
  function toggleConnectionDirection(fromName, toName) {
    for (var i = 0; i < entConnections.length; i++) {
      var p = entConnections[i];
      if ((p[0] === fromName && p[1] === toName) || (p[0] === toName && p[1] === fromName)) {
        if (p[2] === fromName) {
          p.length = 2; // currently one-way from this entrance -> make two-way
        } else {
          p[2] = fromName; // make one-way, pointing from this entrance
        }
        break;
      }
    }
    window._entConnections = entConnections;
    saveConnections();
    redrawAllConnections();
    refreshConnectionDependentDots();
    refreshSyntheticConnections();
    Object.keys(entMarkers).forEach(applyMarkerColor);
  }

  function removeConnection(nameA, nameB) {
    entConnections = entConnections.filter(function(p) {
      return !((p[0] === nameA && p[1] === nameB) || (p[0] === nameB && p[1] === nameA));
    });
    window._entConnections = entConnections;
    saveConnections();
    redrawAllConnections();
    refreshConnectionDependentDots();
    refreshSyntheticConnections();
    Object.keys(entMarkers).forEach(applyMarkerColor);
  }

  function connectionsFor(name) {
    return entConnections.filter(function(p) { return p[0] === name || p[1] === name; })
      .map(function(p) { return p[0] === name ? p[1] : p[0]; });
  }

  // ── Connector "pending" mode ──
  window._entConnectPending = null; // name of first-selected entrance, or null
  window._entConnectFinish = function(name, markerEl) {
    var pendingName = window._entConnectPending;
    var pendingMarker = entMarkers[pendingName];
    if (pendingMarker) pendingMarker.classList.remove('connect-pending');
    window._entConnectPending = null;
    if (name !== pendingName) {
      addConnection(pendingName, name);
    }
  };

  function startConnect(name) {
    // Cancel any existing pending state
    if (window._entConnectPending) {
      var prevMarker = entMarkers[window._entConnectPending];
      if (prevMarker) prevMarker.classList.remove('connect-pending');
    }
    window._entConnectPending = name;
    var marker = entMarkers[name];
    if (marker) marker.classList.add('connect-pending');
  }

  // ── Right-click popup ──
  var popup       = document.getElementById('ent-popup');
  var popupTitle  = document.getElementById('ent-popup-title');
  var popupClear  = document.getElementById('ent-popup-clear');
  var popupConnect = document.getElementById('ent-popup-connect');
  var popupNote   = document.getElementById('ent-popup-note');
  var popupConns  = document.getElementById('ent-popup-connections');
  var popupCols   = document.getElementById('ent-popup-cols');
  var activeName  = null;


  // Build the key-location code grid once.
  KEY_LOCATION_GROUPS.forEach(function(group) {
    var col = document.createElement('div');
    var label = document.createElement('div');
    label.className = 'ent-popup-section-label';
    label.textContent = group.title;
    col.appendChild(label);
    var grid = document.createElement('div');
    grid.className = 'ent-popup-grid';
    group.codes.forEach(function(pair) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ent-popup-btn';
      btn.textContent = pair[1];
      btn.dataset.code = pair[0];
      btn.dataset.markColor = pair[2] || group.color;
      btn.style.background = btn.dataset.markColor;
      btn.style.color = (pair[1] === 'Dark') ? '#fff' : '#111';
      btn.addEventListener('click', function() {
        if (!activeName) return;
        entLabels[activeName] = pair[1];
        saveLabels();
        renderLabel(activeName);
        refreshSyntheticConnections();
        refreshConnectionDependentDots();
        Object.keys(entMarkers).forEach(applyMarkerColor);
        closePopup();
      });
      // Add prize icon for dungeon labels that have a cycled prize (read-only; synced from item tracker)
      var dKeyForBtn = ENT_LABEL_TO_DUNGEON[pair[1]];
      if (dKeyForBtn && DUNGEONS[dKeyForBtn] && DUNGEONS[dKeyForBtn].prize >= 0) {
        (function(dk) {
          var prizeImg = document.createElement('img');
          prizeImg.className = 'ent-popup-prize';
          prizeImg.dataset.dkey = dk;
          prizeImg.src = PRIZE_CYCLE[DUNGEONS[dk].prize].img;
          btn.appendChild(prizeImg);
        })(dKeyForBtn);
      }
      grid.appendChild(btn);
    });
    col.appendChild(grid);
    popupCols.appendChild(col);
  });

  // Highlight grid buttons whose code is currently assigned to any entrance.
  function refreshKeyLocationMarks() {
    var usedCodes = {};
    Object.keys(entLabels).forEach(function(name) {
      usedCodes[entLabels[name]] = true;
    });
    popupCols.querySelectorAll('.ent-popup-btn').forEach(function(btn) {
      btn.classList.toggle('marked', !!usedCodes[btn.textContent]);
    });
  }
  refreshKeyLocationMarks();

  function openPopup(name, markerEl, x, y) {
    activeName = name;
    popupTitle.textContent = name;
    popupNote.value = entNotes[name] || '';
    refreshKeyLocationMarks();
    if (window.refreshPopupPrizeIcons) window.refreshPopupPrizeIcons();
    popupConnect.classList.toggle('active', window._entConnectPending === name);
    popupConnect.textContent = (window._entConnectPending === name) ? 'Cancel Connector' : 'Add Connector';

    popupConns.innerHTML = '';
    var conns = connectionsFor(name);
    if (conns.length) {
      var label = document.createElement('div');
      label.className = 'ent-popup-section-label';
      label.textContent = 'Connected To';
      popupConns.appendChild(label);
      conns.forEach(function(otherName) {
        var pair = entConnections.filter(function(p) {
          return (p[0] === name && p[1] === otherName) || (p[0] === otherName && p[1] === name);
        })[0];
        var oneWayFrom = pair && pair[2];

        var row = document.createElement('div');
        row.className = 'ent-popup-conn-row';
        var swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.background = '#ED18E2';
        var span = document.createElement('span');
        span.style.flex = '1';
        span.style.color = '#ccc';
        span.textContent = oneWayFrom
          ? (oneWayFrom === name ? otherName + ' ← (one-way from here)' : otherName + ' → (one-way into here)')
          : otherName;

        var dirBtn = document.createElement('button');
        dirBtn.type = 'button';
        dirBtn.className = 'ent-popup-btn';
        dirBtn.textContent = oneWayFrom ? 'Make Two-Way' : 'One Way →';
        dirBtn.title = oneWayFrom ? 'Restore as a two-way connector' : 'Mark this connector as one-way, leading from ' + name;
        dirBtn.addEventListener('click', function() {

        var btn = document.createElement('button');
        btn.type = 'button';

        btn.addEventListener('click', function() {

        row.appendChild(swatch);
        row.appendChild(span);
        row.appendChild(dirBtn);
        row.appendChild(btn);

    popup.classList.add('open');
    var pw = popup.offsetWidth, ph = popup.offsetHeight;
    var px = Math.min(x, window.innerWidth  - pw - 8);

    popup.style.left = Math.max(8, px) + 'px';
    popup.style.top  = Math.max(8, py) + 'px';

  function closePopup() {
    popup.classList.remove('open');

  popupClear.addEventListener('click', function() {
    if (!activeName) return;

  popupConnect.addEventListener('click', function() {
    if (!activeName) return;

  popupNote.addEventListener('change', function() {

  popupNote.addEventListener('keydown', function(e) {

  var popupNoteClear = document.getElementById('ent-popup-note-clear');
  popupNoteClear.addEventListener('click', function() {

  });

  document.addEventListener('mousedown', function(e) {
    if (!popup.classList.contains('open')) return;

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      closePopup();
      if (window._entConnectPending) {
        var marker = entMarkers[window._entConnectPending];

  window._entOpenPopup = openPopup;

  // ── Connector visibility toggle (independent of overlay show/hide) ──
  var connToggle = document.getElementById('ent-conn-toggle');
  if (connToggle) {
    var connHidden = (localStorage.getItem('ent-conn-visible') === '0');

    connToggle.addEventListener('change', function() {
      document.getElementById('maps').classList.toggle('ent-conn-hidden', !connToggle.checked);
      localStorage.setItem('ent-conn-visible', connToggle.checked ? '1' : '0');
    });
  }

  // ── Visibility of connector/notes controls ──
  // Only relevant for entrance-shuffle games.
  var entConnWrap     = document.getElementById('ent-conn-toggle-wrap');
  var entInfoBtn      = document.getElementById('ent-info-btn');
  var entSep1         = document.getElementById('ent-sep-1');
  var entSep2         = document.getElementById('ent-sep-2');
  var checklistBtn    = document.getElementById('checklist-btn');

  // Read the flag live on every call — the settings menu can flip map style
  // mid-run, so this must not be captured once at load.
  function updateEntControlsVisibility() {
    var isEntranceShuffle = !!(window.trackerSettings && window.trackerSettings.entranceShuffle);
    var show = isEntranceShuffle;

    var legendEl = document.getElementById('legend');

    var topbarEl = document.getElementById('topbar');
    if (topbarEl) topbarEl.classList.toggle('ent-rows', isEntranceShuffle);
  }

  updateEntControlsVisibility();
  // Exposed so the settings menu can re-run it after a live map-style change.
  window._entUpdateControlsVisibility = updateEntControlsVisibility;

  // ── "Notes & Connectors" summary popup ──
  function isCleared(name) {
    try {
      var clearedState = JSON.parse(localStorage.getItem('ent-cleared') || '{}');
      return !!clearedState[name];
    } catch(ex) { return false; }
  }

  function renderInfoLists() {
    var notesList = document.getElementById('ent-info-notes-list');
    var connsList = document.getElementById('ent-info-conns-list');
    var includeNotesCleared = document.getElementById('ent-info-notes-cleared').checked;
    var includeConnsCleared = document.getElementById('ent-info-conns-cleared').checked;

    notesList.innerHTML = '';
    var noteNames = Object.keys(entNotes).filter(function(name) {
      return includeNotesCleared || !isCleared(name);
    });
    if (!noteNames.length) {
      notesList.innerHTML = '<div class="ent-info-empty">No notes yet.</div>';
    } else {
      noteNames.forEach(function(name) {
        var row = document.createElement('div');
        if (isCleared(name)) row.className = 'ent-info-cleared';
        row.textContent = name + ': ' + entNotes[name];
        notesList.appendChild(row);
      });
    }

    connsList.innerHTML = '';
    var conns = entConnections.filter(function(pair) {
      return includeConnsCleared || (!isCleared(pair[0]) && !isCleared(pair[1]));
    });
    if (!conns.length) {
      connsList.innerHTML = '<div class="ent-info-empty">No connectors yet.</div>';
    } else {
      conns.forEach(function(pair) {
        var row = document.createElement('div');
        if (isCleared(pair[0]) || isCleared(pair[1])) row.className = 'ent-info-cleared';
        row.textContent = pair[0] + ' <--> ' + pair[1];
        connsList.appendChild(row);
      });
    }

    var labelsList = document.getElementById('ent-info-labels-list');
    var includeLabelsCleared = document.getElementById('ent-info-labels-cleared').checked;
    labelsList.innerHTML = '';
    var labelNames = Object.keys(entLabels).filter(function(name) {
      return includeLabelsCleared || !isCleared(name);
    });
    if (!labelNames.length) {
      labelsList.innerHTML = '<div class="ent-info-empty">No labels yet.</div>';
    } else {
      labelNames.forEach(function(name) {
        var row = document.createElement('div');
        if (isCleared(name)) row.className = 'ent-info-cleared';
        row.textContent = name + ': ' + entLabels[name];
        labelsList.appendChild(row);
      });
    }
  }

  var infoPopup = document.getElementById('ent-info-popup');
  var infoBtn   = document.getElementById('ent-info-btn');
  var infoClose = document.getElementById('ent-info-close');
  if (infoBtn) {
    infoBtn.addEventListener('click', function() {
      renderInfoLists();
      infoPopup.classList.add('open');
    });
  }
  if (infoClose) {
    infoClose.addEventListener('click', function() { infoPopup.classList.remove('open'); });
  }
  ['ent-info-notes-cleared', 'ent-info-conns-cleared', 'ent-info-labels-cleared'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('change', renderInfoLists);
  });

  // ── Show/hide Labels column ──
  var showLabelsCheckbox = document.getElementById('ent-info-show-labels');
  var labelsCol = document.getElementById('ent-info-labels-col');
  function applyShowLabels() {
    var show = showLabelsCheckbox.checked;
    if (labelsCol) labelsCol.style.display = show ? '' : 'none';
  }
  if (showLabelsCheckbox) {
    try {
      var savedShowLabels = localStorage.getItem('ent-show-labels-col');
      if (savedShowLabels !== null) showLabelsCheckbox.checked = (savedShowLabels === 'true');
    } catch(ex) {}
    applyShowLabels();
    showLabelsCheckbox.addEventListener('change', function() {
      applyShowLabels();
      try { localStorage.setItem('ent-show-labels-col', showLabelsCheckbox.checked); } catch(ex) {}
    });
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && infoPopup.classList.contains('open')) {
      infoPopup.classList.remove('open');
    }
  });

  // ── Full reset (called from New Game) ──
  window._entResetAll = function() {
    // Clear labels
    Object.keys(entLabels).forEach(function(name) { delete entLabels[name]; });
    saveLabels();
    Object.keys(entLabelEls).forEach(function(name) {
      entLabelEls[name].remove();
      delete entLabelEls[name];
    });
    refreshKeyLocationMarks();
    refreshSyntheticConnections();
    // Clear notes
    Object.keys(entNotes).forEach(function(name) { delete entNotes[name]; });
    saveNotes();
    // Clear connections
    entConnections = [];
    window._entConnections = entConnections;
    saveConnections();
    redrawAllConnections();
    refreshConnectionDependentDots();
    // Clear cleared/connect-pending marker state
    window._entConnectPending = null;
    try { localStorage.removeItem('ent-cleared'); } catch(ex) {}
    Object.keys(entMarkers).forEach(function(name) {
      entMarkers[name].classList.remove('cleared', 'connect-pending', 'ent-marked', 'ent-has-prize');
      entMarkers[name].style.background = '';
      var pIcon = entMarkers[name].querySelector('.ent-marker-prize');
      if (pIcon) pIcon.remove();
    });
    // Close popups if open
    closePopup();
    if (infoPopup) infoPopup.classList.remove('open');
  };
})();

// Refresh popup prize icons from current DUNGEONS state (item tracker is the source).
// Defined globally so the BroadcastChannel prizes handler can call it directly,
// regardless of whether the entrance overlay IIFE has run.
window.refreshPopupPrizeIcons = function() {
  document.querySelectorAll('.ent-popup-prize[data-dkey]').forEach(function(img) {
    var dk = img.dataset.dkey;
    var pDef = DUNGEONS[dk];
    if (!pDef || pDef.prize < 0) return;
    var isGreyed = !!(pDef.cleared || pDef.fullyCleared);
    img.src = isGreyed ? PRIZE_CYCLE[pDef.prize].imgCleared : PRIZE_CYCLE[pDef.prize].img;
  });
};

function cyclePrize(key) {
  var def = DUNGEONS[key];
  def.prize = (def.prize + 1) % PRIZE_CYCLE.length;
  def.img        = PRIZE_CYCLE[def.prize].img;
  def.imgCleared = PRIZE_CYCLE[def.prize].imgCleared;
  refreshDungeonImg(key);
  if (window._entRefreshPrizeIcons) window._entRefreshPrizeIcons();
}

// Prize image: bright (1.png = img) until obtained, then dim (0.png = imgCleared)
// True while TR can only be entered through its back door — mirrored in from
// Mimic or Spiral without the cane, the medallion or a sword. Set by
// dungeonColor('tr'), which refreshMapLogic runs for every dungeon on every
// refresh, and read by js/dngpanel.js to narrow TR's card to the four
// locations that route actually reaches.
window.trBackDoorOnly = function () { return !!window._trBackOnly; };
// Is TR's back door reachable at all? (Mirror in from Mimic or Spiral.)
window.trBackDoorOpen = function () { return !!window._trBackDoor; };

function refreshDungeonImg(key) {
  var def = DUNGEONS[key];
  var img = dngEls[key].querySelector('img');
  if (!img) return;
  var inv = window.trackerSettings && window.trackerSettings.inverted;

  if (inv && key === 'gt') {
    // Aga1 element (DW): show agahnim0 normally, agahnim1 when cleared, hide if fullyCleared
    if (def.fullyCleared) { img.style.display = 'none'; return; }
    img.style.display = '';
    img.src = def.cleared ? 'map/agahnim1.png' : 'map/agahnim0.png';
    return;
  }
  if (inv && key === 'ct') {
    // Ganon element (LW): always boss10, hide when fullyCleared
    if (def.fullyCleared) { img.style.display = 'none'; return; }
    img.style.display = '';
    img.src = 'map/boss10.png';
    return;
  }

  // Standard: CT (Agahnim) hide image when cleared
  if (key === 'ct' && def.fullyCleared) {
    img.style.display = 'none';
    return;
  }
  img.style.display = '';
  // Key Sanity: if prize is unknown but dungeon map is obtained, show map1.png as hint
  // Skip for CT/GT in inverted — they have fixed boss images, not prize cycles
  var settings = window.trackerSettings || {};
  var diModeMap = settings.dungeonItems || 'standard';
  var skipMapHint = inv && (key === 'ct' || key === 'gt');
  // The map-as-prize-hint only means anything where the map is shuffled.
  if (!skipMapHint && (window.shuffleMap ? window.shuffleMap() : false)) {
    var cycle = PRIZE_CYCLE[def.prize];
    if (cycle && cycle.name === 'unknown' && def.mapObtained) {
      img.src = 'items/map1.png';
      return;
    }
  }
  img.src = def.cleared ? def.imgCleared : def.img;
  if (window._entRefreshPrizeIcons) window._entRefreshPrizeIcons();
}

// ── Logic refresh ─────────────────────────────────────────────────────────────
var COLOR_CLASS = { green:'available', yellow:'possible', orange:'visible', purple:'ool', red:'unavail' };

// Paint all four quarters of a marker: `green` of them green (clockwise from
// top left), the rest red. `null` clears the paint. Inline rather than a class
// per combination — the base colour and border still come from the class, only
// the quarter image is computed.
// Boss down with items still inside: the square is grey and the bottom-left
// quadrant is painted the colour of what's left. Two statuses left (say one
// chest in logic and one not) → bottom-left and bottom-right. Inline, so the
// grey base and border still come from the class.
var _LEFT_COLORS = { available:'#4dff88', possible:'#ffd700', visible:'#ff8c00',
                     ool:'#9333ea', unavail:'#ff4444' };
var _LEFT_ORDER  = ['available', 'possible', 'visible', 'ool', 'unavail'];
var _BOTTOM_POS  = ['0 100%', '100% 100%'];
function paintQuarters(el, colors) {
  if (!colors || !colors.length) {
    el.style.backgroundImage = ''; el.style.backgroundPosition = '';
    el.style.backgroundSize  = ''; el.style.backgroundRepeat   = '';
    return;
  }
  el.style.backgroundImage = colors.map(function (c) {
    return 'linear-gradient(' + c + ',' + c + ')';
  }).join(',');
  el.style.backgroundPosition = _BOTTOM_POS.slice(0, colors.length).join(',');
  el.style.backgroundSize     = '50% 50%';
  el.style.backgroundRepeat   = 'no-repeat';
}
// Pots and enemy drops a dungeon still holds, as one quadrant colour: green
// while any of them can be got, red when none can. Used on a dungeon that is
// otherwise finished — the square is grey, but there is still something in it.
function dropLeftColors(key) {
  if (typeof window.dungeonDropRollup !== 'function') return [];
  var left = 0, obtainable = 0;
  window.dungeonDropRollup(key).forEach(function (r) {
    var l = r.total - r.done;
    if (l <= 0) return;
    left += l;
    obtainable += Math.max(0, l - (r.blocked || 0));
  });
  return left ? [obtainable ? '#4dff88' : '#ff4444'] : [];
}

// The (at most two) colours of what a dungeon still has in it, best first.
function leftoverColors(counts) {
  return _LEFT_ORDER.filter(function (k) { return counts.byCls[k]; })
                    .slice(0, 2)
                    .map(function (k) { return _LEFT_COLORS[k]; });
}

window.refreshMapLogic = function() {
  if (window.potReachInvalidate) window.potReachInvalidate();
  Object.keys(DUNGEONS).forEach(function(key) {
    var def = DUNGEONS[key];
    var el  = dngEls[key];
    var diMode = (window.trackerSettings && window.trackerSettings.dungeonItems) || 'standard';
    if (diMode === 'other') {
      // Other mode: boss beaten + chest clicked → cleared; boss beaten only → boss-cleared (light blue)
      if (def.cleared && def.otherCleared) {
        el.className = 'dng cleared';
      } else if (def.cleared) {
        el.className = 'dng boss-cleared';
      } else {
        var c = COLOR_CLASS[window.dungeonColor(key)] || 'unavail';
        el.className = 'dng ' + c;
      }
    } else if (def.fullyCleared) {
      // All items + boss done — go dark
      el.className = 'dng cleared';
    } else if (def.cleared) {
      // Boss beaten but items remain — light grey (vs the dark grey of a
      // finished dungeon), with the quarters painted below saying what's left.
      el.className = 'dng boss-cleared';
    } else {
      var c = COLOR_CLASS[window.dungeonColor(key)] || 'unavail';
      el.className = 'dng ' + c;
    }
    // ── Boss status stripe overlay ──

// ── Entrance state save / load ────────────────────────────────────────────────
function saveEntState() {
  var state = {
    labels:      localStorage.getItem('ent-labels')      || '{}',
    connections: localStorage.getItem('ent-connections') || '[]',
    cleared:     localStorage.getItem('ent-cleared')     || '{}',
    notes:       localStorage.getItem('ent-notes')       || '{}',
    checks:      localStorage.getItem('alttp-checks')    || '{}',
  };
  var json = JSON.stringify(state, null, 2);
  if (window.electronAPI && window.electronAPI.saveEntState) {
    window.electronAPI.saveEntState(json);
  } else {
    // Browser fallback: download as file
    var blob = new Blob([json], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'alttp-entrance-state.json';
    a.click();
  }
}

function loadEntState() {
  if (window.electronAPI && window.electronAPI.loadEntState) {
    window.electronAPI.loadEntState(function(json) {
      _applyEntState(json);
    });
  } else {
    // Browser fallback: file picker
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = function() {
      var file = input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) { _applyEntState(e.target.result); };
      reader.readAsText(file);
    };
    input.click();
  }
}

function _applyEntState(json) {
  try {
    var state = JSON.parse(json);
    if (state.labels)      localStorage.setItem('ent-labels',      state.labels);
    if (state.connections) localStorage.setItem('ent-connections', state.connections);
    if (state.cleared)     localStorage.setItem('ent-cleared',     state.cleared);
    if (state.notes)       localStorage.setItem('ent-notes',       state.notes);
    // Not 'alttp-checks' — the reload below clears that by design. See the
    // one-shot pickup in the check-state block above.
    if (state.checks)      localStorage.setItem('alttp-checks-restore', state.checks);
    // Reload the page to apply all restored state cleanly
    location.reload();
  } catch(e) {
    alert('Failed to load state file: ' + e.message);
  }
}

    xhr.onerror = function() { console.warn('OnlyADKD map could not be read'); };
